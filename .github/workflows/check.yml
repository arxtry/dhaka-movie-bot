name: Dhaka Ticket Tracker
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 playwright && playwright install chromium
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py
      - name: Save seen movies state
        run: |
          git config user.name "CinemotherBot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_movies.json || true
          git diff --staged --quiet || git commit -m "Update movie catalog"
          git push
